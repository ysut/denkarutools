# =============================================================
# 婦人科化学療法レジメン（参照用定義）
# =============================================================
# 用途: 婦人科がん化学療法レジメンの参照用まとめ。
#       （化学療法スケジュール機能が使う data/regimens.toml とは別ファイル・別スキーマ）
#
# ⚠ 重要な注意:
#   - 本ファイルは院内レジメン資料からの「事実情報の転記」です。用量・投与法は
#     必ず最新の添付文書・各種ガイドライン・院内レジメン審査・主治医の判断を優先してください。
#   - 用量の単位は特記なき限り mg/m²。AUC はカルボプラチンの Calvert 式目標 AUC。
#     体重あたりは mg/kg、固定量は mg/body、経口の連日量は mg/日 と明記しています。
#   - スキャン資料からの読み取りのため、誤りが残る可能性があります。臨床利用前に要検証。
#
# スキーマ:
#   [[regimens]]
#     id          : 短い識別子（重複しない）
#     name        : レジメン名
#     category    : 疾患カテゴリ
#     indications : 適応（配列）
#     line        : 治療ライン・位置づけ（記載があれば）
#     cycle       : 投与間隔（例 "3週毎(21日)"）
#     courses     : コース数の目安（記載があれば）
#     notes       : 備考（前投薬・上限・変種など）
#   [[regimens.drugs]]
#     name, dose, route, days
# =============================================================


